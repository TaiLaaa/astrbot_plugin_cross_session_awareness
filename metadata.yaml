name: cross_session_awareness
desc: 跨会话感知插件 - 跨群记忆 + 群聊上下文感知，bot 能记住各群对话并在其他群引用
help: |
  本插件自动运行，无需命令。
  功能1：记录用户在各个群/私聊中的最近发言摘要，实现跨会话感知。
  功能2（v2.0新增）：记录群聊对话上下文，bot 能在其他群回答"XX群的XX怎么了"之类的问题。
  管理命令：
    /跨群感知 状态 — 查看插件状态
    /跨群感知 群聊动态 — 查看各群的对话摘要
    /跨群感知 查看 — 查看自己的跨会话记忆
    /跨群感知 可用模型 — 列出可配置的 LLM 模型
version: v2.0.0
author: Antigravity
repo: ""
